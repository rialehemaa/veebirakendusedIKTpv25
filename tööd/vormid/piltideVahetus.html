<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Piltide vahetus JS abil</title>
    <link rel="stylesheet" href="piltStyle.css">
    <script src="../js/piltScript.js"></script>
</head>
<body>
<!-- Paint: 4 pilti: smile.png, neutral.png, kurb.png, lill.png 300*300px -->
<h1>Piltide vahetus</h1>
<h2>Juhuslik pilt</h2>
<img src="../images/lill.png" alt="" id="randomPilt">
<input type="button" onclick="juhuslikPilt()" value="Vaheta pilt">

<section id="myistatus">
    <h2>Mõistatus. Arva ära mida näed pildil?</h2>
    <label for="valik">Tee oma valik:</label>
    <select name="valik" id="valik" onchange="selectValik()">
        <option value="vali...">vali</option>
        <option value="../images/smile.png">Smile</option>
        <option value="../images/lill.png">Lilleke</option>
        <option value="../images/neutral.png">Neutral</option>
        <option value="../images/kurb.png">Kurb</option>
    </select>
    <div id="vastus">Siia tuleb vastus</div>
</section>
<section id="valik2">
    <input type="radio" name="piltValik" id="v1" value="../images/kurb.png" onclick="radioValik()">
    <label for="v1">Kurb pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v2" value="../images/smile.png" onclick="radioValik()">
    <label for="v2">Smile pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v3" value="../images/lill.png" onclick="radioValik()">
    <label for="v3">Lill pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v4" value="../images/neutral.png" onclick="radioValik()">
    <label for="v4">Neutral pilt</label>
    <br>
    <img src="" alt="" id="valitudPilt">

</section>

</body>
</html>
