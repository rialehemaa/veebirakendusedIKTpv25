<!--sisu-->
<main>
  <h2>Meedia</h2>

  <div id="suurkast">

    <!--1. Pildigalerii - 6 juhuslikku pilti saidilt picsum.photos, igaüks 300x300-->
    <section id="pildigalerii">
      <h3>Pildigalerii</h3>
      <div class="pildid">
        <img src="https://picsum.photos/300/300?random=1" alt="Juhuslik pilt 1" loading="lazy">
        <img src="https://picsum.photos/300/300?random=2" alt="Juhuslik pilt 2" loading="lazy">
        <img src="https://picsum.photos/300/300?random=3" alt="Juhuslik pilt 3" loading="lazy">
        <img src="https://picsum.photos/300/300?random=4" alt="Juhuslik pilt 4" loading="lazy">
        <img src="https://picsum.photos/300/300?random=5" alt="Juhuslik pilt 5" loading="lazy">
        <img src="https://picsum.photos/300/300?random=6" alt="Juhuslik pilt 6" loading="lazy">
      </div>
    </section>

    <!--2. Video - YouTube embed, play/pause ja fullscreen toega-->
    <section id="video">
      <h3>Video</h3>
      <iframe width="300" height="200"
              src="https://www.youtube.com/embed/aqz-KE-bpKQ"
              title="YouTube video"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
      </iframe>
    </section>

    <!--3. Kaart - Google Maps embed konkreetse asukohaga-->
    <section id="kaart">
      <h3>Kaart</h3>
      <iframe
              src="https://www.google.com/maps?q=Tallinna+Raekoda&output=embed"
              width="300" height="200"
              style="border:0;"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </section>

    <!--4. Muusika - SoundCloud embed, esitatav ja peatatav-->
    <section id="muusika">
      <h3>Muusika</h3>
      <iframe width="300" height="200" scrolling="no" frameborder="no" allow="autoplay"
              src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&color=%23ff5500&auto_play=false&hide_related=false&show_comments=false&show_user=true&show_reposts=false&show_teaser=true">
      </iframe>
    </section>

  </div>
</main>
<!--jalus-->
<footer>

  </div>

</body>
