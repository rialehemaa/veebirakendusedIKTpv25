<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Canvas joonistamine</title>
    <link rel="stylesheet" href="canvasStyle.css">
    <script src="canvasScript.js"></script>
</head>
<body>
<h1>Joonistusrkendus Canvas +js</h1>
<canvas id="canvas" width="400" height="400"></canvas>
<table>
    <tr>
        <td>
            <input type="button" value="Puhasta" onclick="puhasta()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Joon" onclick="joon()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Kolmnurk" onclick="kolmnurk()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Ristkülik" onclick="ristkylik()">
            <label for="laius">Laius:</label>
            <input type="number" id="laius" min="1" max="50" step="2" onchange="ristkylik()">
            <label for="kyrgus">Kõrgus:</label>
            <input type="number" id="kyrgus" min="1" max="50" step="2" onchange="ristkylik()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Ring" onclick="ring()">
            <label for="raadius">Raadius:</label>
            <input type="number" id="raadius" min="1" max="50" step="2" onchange="ring()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Pilt" onclick="pilt()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Kabiin" onclick="kabiin()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Kere" onclick="kere()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Rattad" onclick="rattad()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Veljed" onclick="veljed()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Tuled" onclick="tuled()">
        </td>
    </tr>
</table>

</body>
</html>
