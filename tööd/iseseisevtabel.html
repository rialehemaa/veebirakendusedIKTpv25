<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Iseseisev tabel</title>
    <link rel="stylesheet" href="iseseisevtabelStyle.css">
</head>
<body>
<h1>Iseseisev tabel</h1>


<table id="iseseisev">
    <tr>
        <td>A</td>
        <td colspan="4">B</td>
        <td>C</td>
    </tr>
    <tr>
        <td>D</td>
        <td>E</td>
        <td colspan="2">F</td>
        <td>G</td>
        <td>I</td>
    </tr>
    <tr>
        <td>1</td>
        <td colspan="2" rowspan="2">3</td>
        <td colspan="2" rowspan="2">4</td>
        <td>5</td>
    </tr>
    <tr>
        <td>2</td>
        <td>6</td>
    </tr>
</table>

</body>
</html>
