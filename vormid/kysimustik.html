<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <link rel="stylesheet" href="vormStyle.css">
    <script src="../js/kysimustikScript.js"></script>
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
    <!-- c + tab komentaar -->

    <table border="1">
        <tr>
            <td>
                <!-- Tekstkast -->
                <label for="nimi">Nimi:</label>
            </td>
            <td>
                <input type="text" id="nimi" placeholder="Dariia" oninput="nimiLugemineKastist()">
            </td>
            <td>
                <div id="vastus1"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- ripploend või rippmenüü -->
                <label for="stiil">Vali meeldivaim muusikastiil:</label>
                </td>
            <td>
                <select name="stiil" id="stiil" onchange="selectValik()">
                    <option value="vali">vali..</option>
                    <option value="hiphop">hiphop</option>
                    <option value="kantri">kantri</option>
                    <option value="rock">rock</option>
                    <option value="metal">metal</option>
                    <option value="jazz">jazz</option>
                </select>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>
        </tr>
        <tr>
            <td>
                <strong>
                    Kuidas sa muusikat peamiselt kuulad?
                </strong>
                </td>
            <td>
                <input type="radio" name="platvorm" id="spotify" value="spotify" onclick="radioValik()">
                <label for="spotify">Spotify</label>
                <br>
                <input type="radio" name="platvorm" id="raadio" value="raadio" onclick="radioValik()">
                <label for="raadio">raadio</label>
                <br>
                <input type="radio" name="platvorm" id="vinüülplaat" value="vinüülplaat" onclick="radioValik()">
                <label for="vinüülplaat">vinüülplaat</label>
                <br>
                <input type="radio" name="platvorm" id="youtube" value="youtube" onclick="radioValik()">
                <label for="youtube">Youtube</label>
            </td>
            <td>
                <div id="vastus2"></div>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <!-- checkbox - markerruut -->
                <fieldset>
                    <legend>Tee oma valikud - lemmik ansambel</legend>
                    <input type="checkbox" name="lemmikud" id="queen" value="Queen" onchange="checkboxValik()">
                    <label for="queen">Queen</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="metallica" value="Metallica" onchange="checkboxValik()">
                    <label for="metallica">Metallica</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="abba" value="ABBA" onchange="checkboxValik()">
                    <label for="abba">ABBA</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="nirvana" value="Nirvana" onchange="checkboxValik()">
                    <label for="nirvana">Nirvana</label>
                    <br>
                </fieldset>
            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- range - vahemik -->
                <label for="tund">
                    Mitu tundi päevas sa kuulad muusikat?
                </label>
                </td>
            <td>
                0<input type="range" id="tund" min="0" max="24" onchange="rangeValik()">24
            </td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
        <!--Lemmikvärv-->
        <tr>
            <td>
                <label for="varv">Lemmikvärv:</label>
            </td>
            <td>
                <input type="color" id="varv">
            </td>
        </tr>
        <!-- Oma pilt-->
        <tr>
            <td>
                <label for="pilt">Lisa oma pilt:</label>
            </td>
            <td>
                <input type="file" id="pilt">
            </td>
        </tr>
        <!--E-post-->
        <tr>
            <td>
                <label for="epost">E-post:</label>
            </td>
            <td>
                <input type="email" id="epost" placeholder="nimi@näide.ee">
            </td>
        </tr>
        <!--Sünnipäev-->
        <tr>
            <td>
                <label for="sünnipäev">Sünnipäev:</label>
            </td>
            <td>
                <input type="date" id="sünnipäev">
            </td>
        </tr>
        <!--Telefoninumber-->
        <tr>
            <td>
                <label for="telefon">Telefoninumber:</label>
            </td>
            <td>
                <input type="tel" id="telefon" placeholder="+372 5xxxxxxx">
            </td>
        </tr>

        <td>
            <input type="reset" value="Puhasta" onclick="puhasta()">
        </td>
        <td>
            <input type="button" value="Näita/Loe andmed" onclick="naitaKoike()">
        </td>
        <td>
            <div id="vastusKoik"></div>
        </td>

</form>
</body>
</html>
